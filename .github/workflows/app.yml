# App: Prüfung + Android-APK (GitHub-Version) + Play-Store-Bundle + Windows-App (bei jedem Lauf) + iOS-IPA für Sideloading (Tags/manuell)
name: App

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["mobile/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/app.yml"]
  workflow_dispatch:
    inputs:
      ios:
        description: "Auch die iOS-Version bauen (macOS-Runner)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  check:
    name: Analyse & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Die Platzhalter für Werbe- und Kauf-Paket (GitHub-APK, Windows, iPhone) müssen zu dem passen, was die App davon nutzt
      - name: Analyse mit den Platzhaltern für Werbe- und Kauf-Paket
        run: |
          printf 'dependency_overrides:\n  google_mobile_ads:\n    path: packages/google_mobile_ads_stub\n  in_app_purchase:\n    path: packages/in_app_purchase_stub\n' > pubspec_overrides.yaml
          flutter pub get
          flutter analyze

  android:
    name: Android-APK
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signaturschlüssel aus den Secrets (für Updates ohne Neuinstallation)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein Signaturschlüssel hinterlegt – die APK wird mit einem Test-Schlüssel signiert. Updates erfordern dann eine Neuinstallation (siehe README)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/selfify.keystore
          cat > android/key.properties <<PROPS
          storeFile=selfify.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"
      # Die GitHub-Version hat keine Werbung und keinen Kauf in der App. Das Werbe-SDK (google_mobile_ads) und die
      # Billing-Bibliothek (in_app_purchase) gehören nur in die Play-Version: Mit dem Werbe-SDK startete die GitHub-App
      # am Handy nicht mehr. Hier werden beide durch Platzhalter ersetzt.
      - name: Werbe- und Kauf-SDK weglassen (nur in der Play-Version)
        run: |
          printf 'dependency_overrides:\n  google_mobile_ads:\n    path: packages/google_mobile_ads_stub\n  in_app_purchase:\n    path: packages/in_app_purchase_stub\n' > pubspec_overrides.yaml
      - run: flutter pub get
      # Flutter braucht ein NDK, das auf den GitHub-Rechnern fehlt. Gradle würde es beim Bauen ohne
      # Wiederholung laden – ein abgebrochener Download ließ dann den ganzen Build scheitern.
      - name: Android-NDK laden (mit Wiederholung)
        run: |
          NDK_VERSION=$(grep -oP 'val ndkVersion: String = "\K[^"]+' \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" || true)
          if [ -z "$NDK_VERSION" ]; then
            echo "::warning::NDK-Version nicht gefunden – Gradle lädt das NDK selbst."
            exit 0
          fi
          echo "NDK $NDK_VERSION"
          for attempt in 1 2 3; do
            # "yes" nicht per Pipe davorhängen: Es endet mit SIGPIPE, sobald der sdkmanager fertig ist – mit
            # "pipefail" gälte der gelungene Download dann als fehlgeschlagen
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" < <(yes) > /dev/null; then
              exit 0
            fi
            echo "::warning::NDK-Download fehlgeschlagen (Versuch $attempt), neuer Versuch …"
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            sleep 15
          done
          exit 1
      - name: APK bauen
        env:
          # Dort schaut die App nach neueren Versionen (Update-Hinweis). Nur mit festem Signaturschlüssel –
          # sonst lehnt Android das Update ohnehin ab und der Hinweis würde ins Leere führen.
          UPDATE_MANIFEST_URL: ${{ steps.signing.outputs.signed == 'true' && format('https://github.com/{0}/releases/download/app-latest/version.json', github.repository) || '' }}
        # --flavor full: die GitHub-Version (die Play-Version baut der Job "Play-Bundle")
        run: >-
          flutter build apk --release --flavor full --build-number=${{ github.run_number }}
          --dart-define=UPDATE_MANIFEST_URL="$UPDATE_MANIFEST_URL"
      - run: mv build/app/outputs/flutter-apk/app-full-release.apk build/selfify.apk
      - name: Prüfen, dass die GitHub-Version sich selbst aktualisieren darf
        run: |
          FILES=$(find build/app/intermediates -path '*merged_manifest*fullRelease*' -name AndroidManifest.xml)
          if [ -z "$FILES" ]; then echo "::warning::Zusammengeführte Manifest-Datei nicht gefunden - Prüfung übersprungen."; exit 0; fi
          # shellcheck disable=SC2086
          grep -q 'REQUEST_INSTALL_PACKAGES' $FILES || { echo "::error::REQUEST_INSTALL_PACKAGES fehlt in der GitHub-Version - der Update-Hinweis könnte nicht installieren."; exit 1; }
      - name: Prüfen, dass kein Werbe-SDK in der GitHub-Version steckt
        run: |
          FILES=$(find build/app/intermediates -path '*merged_manifest*fullRelease*' -name AndroidManifest.xml)
          if [ -z "$FILES" ]; then echo "::warning::Zusammengeführte Manifest-Datei nicht gefunden - Prüfung übersprungen."; exit 0; fi
          # shellcheck disable=SC2086
          if grep -q 'com.google.android.gms.ads' $FILES; then
            echo "::error::Die GitHub-Version enthält das Werbe-SDK - sie startete damit am Handy nicht mehr."
            exit 1
          fi
      - name: Prüfen, dass kein Google Play Billing in der GitHub-Version steckt
        run: |
          # Der Platzhalter muss gegriffen haben: kein natives Billing-Plugin in der Plugin-Liste der App
          if grep -q 'in_app_purchase_android' .flutter-plugins-dependencies; then
            echo "::error::Die GitHub-Version enthält das Plugin in_app_purchase_android - der Platzhalter (pubspec_overrides.yaml) hat nicht gegriffen."
            exit 1
          fi
          # ... und keine Billing-Bibliothek in der fertigen APK
          if unzip -l build/selfify.apk | grep -i 'billingclient'; then
            echo "::error::Die GitHub-Version enthält Google Play Billing - das Bauteil gehört nur in die Play-Version."
            exit 1
          fi
          FILES=$(find build/app/intermediates -path '*merged_manifest*fullRelease*' -name AndroidManifest.xml)
          if [ -z "$FILES" ]; then echo "::warning::Zusammengeführte Manifest-Datei nicht gefunden - Prüfung übersprungen."; exit 0; fi
          # shellcheck disable=SC2086
          if grep -E 'com\.android\.vending\.BILLING|com\.android\.billingclient' $FILES; then
            echo "::error::Die GitHub-Version enthält Google Play Billing - das Bauteil gehört nur in die Play-Version."
            exit 1
          fi
      - name: Prüfen, dass Offline-Musik nicht per Sicherung zurückkommt
        run: |
          # Offline-Dateien liegen im privaten App-Speicher und verschwinden beim Deinstallieren. Damit sie nicht über die
          # Google-Sicherung oder einen Geräteumzug zurückkommen, sichern die Backup-Regeln nur die Einstellungen.
          FILES=$(find build/app/intermediates -path '*merged_manifest*fullRelease*' -name AndroidManifest.xml)
          if [ -z "$FILES" ]; then echo "::warning::Zusammengeführte Manifest-Datei nicht gefunden - Prüfung übersprungen."; exit 0; fi
          # shellcheck disable=SC2086
          # Attribut samt Wert - der bloße Name steht auch in einem Kommentar des Manifests und bewiese nichts
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' $FILES || { echo "::error::Backup-Regeln (android:dataExtractionRules, Android 12+) fehlen im Manifest - Offline-Musik könnte per Google-Sicherung oder Geräteumzug zurückkommen."; exit 1; }
          # shellcheck disable=SC2086
          grep -q 'android:fullBackupContent="@xml/backup_rules"' $FILES || { echo "::error::Backup-Regeln (android:fullBackupContent, bis Android 11) fehlen im Manifest - Offline-Musik könnte per Google-Sicherung zurückkommen."; exit 1; }
          # shellcheck disable=SC2086
          if grep -q 'hasFragileUserData="true"' $FILES; then
            echo "::error::hasFragileUserData ist gesetzt - Android böte beim Deinstallieren an, die Daten (Offline-Musik) zu behalten."
            exit 1
          fi
      - name: APK als Artefakt (nur zum Testen, falls Speicher frei)
        uses: actions/upload-artifact@v7
        # Bei privaten Repositories teilen sich Artefakte und Images 500 MB – ist das voll,
        # soll der Build trotzdem grün bleiben. Die APK gibt es zusätzlich als Release.
        continue-on-error: true
        with:
          name: selfify-android
          path: mobile/build/selfify.apk
          retention-days: 3
      - name: Aktuelle APK als Release "app-latest" (bei jedem Stand auf main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          FILES="build/selfify.apk"
          if [ "$SIGNED" = "true" ]; then
          # version.json: daran erkennt die App, dass es eine neuere Version gibt
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+]*).*/\1/')
          cat > build/version.json <<JSON
          {
            "build": ${{ github.run_number }},
            "version": "$VERSION",
            "commit": "${GITHUB_SHA::7}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "android": {
              "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/app-latest/selfify.apk",
              "sha256": "$(sha256sum build/selfify.apk | cut -d' ' -f1)"
            }
          }
          JSON
          cat build/version.json
          FILES="$FILES build/version.json"
          else
            echo "::warning::Ohne festen Signaturschlüssel wird keine version.json veröffentlicht – kein Update-Hinweis in der App."
          fi
          gh release delete app-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          # shellcheck disable=SC2086
          gh release create app-latest $FILES --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "App – aktuelle Version" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Installation siehe README."
      - name: Release mit APK (bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: mobile/build/selfify.apk

  play:
    name: Play-Bundle
    # Läuft erst nach der APK: Der Android-Job legt das Release "app-latest" bei jedem Stand auf main komplett neu
    # an. Danach legt dieser Job das Bundle dazu. Schlägt der Bau fehl, ist die APK trotzdem schon veröffentlicht.
    needs: android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signaturschlüssel aus den Secrets (Upload-Schlüssel für Google Play)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein Signaturschlüssel hinterlegt - das Bundle wird mit einem Test-Schlüssel signiert und von Google Play abgelehnt."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/selfify.keystore
          cat > android/key.properties <<PROPS
          storeFile=selfify.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"
      # Ohne pubspec_overrides.yaml: Die Play-Version bekommt die echten Pakete (Werbe-SDK und Google Play Billing).
      # Liegt die Datei doch im Repository (versehentlich mit eingecheckt - die README leitet für den lokalen Bau der
      # GitHub-Version dazu an), bekäme das Bundle die Platzhalter: keine Werbung, und niemand könnte kaufen.
      - name: Abbrechen, wenn die Platzhalter-Pakete eingestellt sind (pubspec_overrides.yaml)
        run: |
          if [ -e pubspec_overrides.yaml ] || [ -L pubspec_overrides.yaml ]; then
            echo "::error::mobile/pubspec_overrides.yaml liegt im Repository - die Play-Version würde mit den Platzhaltern statt mit Werbe-SDK und Google Play Billing gebaut. Datei aus dem Repository entfernen (git rm mobile/pubspec_overrides.yaml)."
            exit 1
          fi
      - run: flutter pub get
      - name: Android-NDK laden (mit Wiederholung)
        run: |
          NDK_VERSION=$(grep -oP 'val ndkVersion: String = "\K[^"]+' \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" || true)
          if [ -z "$NDK_VERSION" ]; then
            echo "::warning::NDK-Version nicht gefunden - Gradle lädt das NDK selbst."
            exit 0
          fi
          echo "NDK $NDK_VERSION"
          for attempt in 1 2 3; do
            # "yes" nicht per Pipe davorhängen: Es endet mit SIGPIPE, sobald der sdkmanager fertig ist – mit
            # "pipefail" gälte der gelungene Download dann als fehlgeschlagen
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" < <(yes) > /dev/null; then
              exit 0
            fi
            echo "::warning::NDK-Download fehlgeschlagen (Versuch $attempt), neuer Versuch ..."
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            sleep 15
          done
          exit 1
      - name: Play-Bundle bauen (Flavor play)
        env:
          # Werbung (AdMob): IDs aus dem AdMob-Konto, hinterlegt unter GitHub > Settings > Secrets and variables >
          # Actions > Variables (ADMOB_APP_ID, ADMOB_BANNER_ID). Leer = Test-Anzeigen von Google (siehe docs/PLAYSTORE.md).
          ORG_GRADLE_PROJECT_admobAppId: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
          # Feste Server-Adresse der Play-Version (z. B. https://musik.technologyplanet.org), GitHub > Settings >
          # Secrets and variables > Actions > Variables (PLAY_SERVER_URL). Leer = die App fragt nach der Adresse.
          PLAY_SERVER_URL: ${{ vars.PLAY_SERVER_URL }}
        run: |
          ARGS=()
          # Ein leerer Wert würde die eingebaute Test-Kennung überschreiben - nur setzen, wenn vorhanden
          if [ -n "$ADMOB_BANNER_ID" ]; then ARGS+=("--dart-define=ADMOB_BANNER_ID=$ADMOB_BANNER_ID"); fi
          if [ -n "$PLAY_SERVER_URL" ]; then
            # Passwörter dürfen nicht unverschlüsselt durchs Internet gehen - in der Store-Version nur https://
            case "$PLAY_SERVER_URL" in
              https://?*) ;;
              *) echo "::error::PLAY_SERVER_URL muss mit https:// beginnen und einen Servernamen enthalten (ist: $PLAY_SERVER_URL)."; exit 1 ;;
            esac
            echo "Feste Server-Adresse: $PLAY_SERVER_URL"
            ARGS+=("--dart-define=SERVER_URL=$PLAY_SERVER_URL")
          else
            echo "::warning::PLAY_SERVER_URL nicht gesetzt - die Play-Version fragt nach der Server-Adresse."
          fi
          flutter build appbundle --release --flavor play --build-number=${{ github.run_number }} \
            --dart-define=CHANNEL=play "${ARGS[@]}"
          mv build/app/outputs/bundle/playRelease/app-play-release.aab build/selfify-play.aab
      - name: Prüfen, dass die Play-Version keine Selbst-Installation enthält
        run: |
          # Google Play lehnt Apps mit REQUEST_INSTALL_PACKAGES ab (nur für Stores/Installer erlaubt)
          FILES=$(find build/app/intermediates -path '*merged_manifest*playRelease*' -name AndroidManifest.xml)
          if [ -z "$FILES" ]; then echo "::warning::Zusammengeführte Manifest-Datei nicht gefunden - Prüfung übersprungen."; exit 0; fi
          echo "Geprüft: $FILES"
          # shellcheck disable=SC2086
          if grep -E 'INSTALL_PACKAGES|WRITE_EXTERNAL_STORAGE|OtaUpdate' $FILES; then
            echo "::error::Die Play-Version enthält Berechtigungen/Bauteile zur Selbst-Installation - Google Play würde sie ablehnen."
            exit 1
          fi
          # shellcheck disable=SC2086
          grep -q 'com.google.android.gms.ads.APPLICATION_ID' $FILES || { echo "::error::AdMob-App-ID fehlt im Manifest - das Werbe-SDK würde beim Start abstürzen."; exit 1; }
      - name: Prüfen, dass die Play-Version kaufen kann (Google Play Billing)
        run: |
          # Die Berechtigung allein beweist nichts: Sie steht fest im Play-Manifest der App. Geprüft wird deshalb, dass
          # das echte Kauf-Bauteil eingebaut ist und nicht der Platzhalter (in_app_purchase_stub).
          # 1. Plugin-Liste der App: Das native Billing-Plugin gibt es nur mit dem echten Paket
          if ! grep -q 'in_app_purchase_android' .flutter-plugins-dependencies; then
            echo "::error::Die Play-Version enthält das Plugin in_app_purchase_android nicht - statt Google Play Billing steckt der Platzhalter im Bundle, niemand könnte kaufen."
            exit 1
          fi
          # 2. Bauteil der Billing-Bibliothek (com.android.billingclient.api.ProxyBillingActivity): Es kommt nur aus der
          #    echten Bibliothek ins Manifest. Gesucht wird in der zusammengeführten Manifest-Datei und im Manifest des
          #    fertigen Bundles (dort binär gespeichert, die Namen stehen aber lesbar darin)
          FILES=$(find build/app/intermediates -path '*merged_manifest*playRelease*' -name AndroidManifest.xml)
          FOUND=""
          # shellcheck disable=SC2086
          if [ -n "$FILES" ] && grep -q 'com\.android\.billingclient' $FILES; then FOUND="zusammengeführtes Manifest"; fi
          if [ -z "$FOUND" ]; then
            # Erst in eine Datei auspacken, dann suchen – nicht "unzip -p … | grep -q": grep beendet sich beim ersten
            # Treffer, unzip bekäme SIGPIPE, und mit "pipefail" gälte der Treffer als Fehlschlag
            BUNDLE_MANIFEST="$RUNNER_TEMP/play-bundle-manifest.bin"
            if unzip -p build/selfify-play.aab base/manifest/AndroidManifest.xml > "$BUNDLE_MANIFEST" 2>/dev/null \
              && grep -a -q 'com\.android\.billingclient' "$BUNDLE_MANIFEST"; then
              FOUND="Manifest im Bundle"
            fi
          fi
          if [ -z "$FOUND" ]; then
            echo "::error::Die Billing-Bibliothek (com.android.billingclient) fehlt im Play-Bundle - der Kauf in der App würde nicht funktionieren."
            exit 1
          fi
          echo "Billing-Bibliothek gefunden: $FOUND"
          # 3. Berechtigung zum Kaufen
          if [ -z "$FILES" ]; then echo "::warning::Zusammengeführte Manifest-Datei nicht gefunden - Billing-Berechtigung nicht geprüft."; exit 0; fi
          # shellcheck disable=SC2086
          grep -q 'com\.android\.vending\.BILLING' $FILES || { echo "::error::Billing-Berechtigung fehlt - der Kauf in der App würde nicht funktionieren."; exit 1; }
      - name: Prüfen, dass Offline-Musik nicht per Sicherung zurückkommt
        run: |
          # Offline-Dateien liegen im privaten App-Speicher und verschwinden beim Deinstallieren. Damit sie nicht über die
          # Google-Sicherung oder einen Geräteumzug zurückkommen, sichern die Backup-Regeln nur die Einstellungen.
          FILES=$(find build/app/intermediates -path '*merged_manifest*playRelease*' -name AndroidManifest.xml)
          if [ -z "$FILES" ]; then echo "::warning::Zusammengeführte Manifest-Datei nicht gefunden - Prüfung übersprungen."; exit 0; fi
          # shellcheck disable=SC2086
          # Attribut samt Wert - der bloße Name steht auch in einem Kommentar des Manifests und bewiese nichts
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' $FILES || { echo "::error::Backup-Regeln (android:dataExtractionRules, Android 12+) fehlen im Manifest - Offline-Musik könnte per Google-Sicherung oder Geräteumzug zurückkommen."; exit 1; }
          # shellcheck disable=SC2086
          grep -q 'android:fullBackupContent="@xml/backup_rules"' $FILES || { echo "::error::Backup-Regeln (android:fullBackupContent, bis Android 11) fehlen im Manifest - Offline-Musik könnte per Google-Sicherung zurückkommen."; exit 1; }
          # shellcheck disable=SC2086
          if grep -q 'hasFragileUserData="true"' $FILES; then
            echo "::error::hasFragileUserData ist gesetzt - Android böte beim Deinstallieren an, die Daten (Offline-Musik) zu behalten."
            exit 1
          fi
      - name: Bundle als Artefakt (nur zum Testen, falls Speicher frei)
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: selfify-play-bundle
          path: mobile/build/selfify-play.aab
          retention-days: 14
      - name: Bundle ins Release "app-latest" legen (bei jedem Stand auf main, nur signiert)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nur in das Release dieses Stands - ein später neu gestarteter alter Lauf darf neuere Dateien nicht ersetzen
          TARGET=$(gh release view app-latest --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish)
          if [ "$TARGET" != "$GITHUB_SHA" ]; then
            echo "::warning::app-latest gehört inzwischen zu $TARGET - das Bundle dieses Laufs wird nicht hochgeladen."
            exit 0
          fi
          gh release upload app-latest build/selfify-play.aab --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    name: Windows-App
    # Läuft erst nach der APK: Der Android-Job legt das Release "app-latest" bei jedem Stand auf main
    # komplett neu an (alte Dateien fliegen dabei raus). Danach legt dieser Job die Windows-Dateien dazu.
    # Schlägt der Windows-Build fehl, ist die APK trotzdem schon veröffentlicht.
    needs: android
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # smtc_windows (Medientasten, Windows-Medienübersicht) wird beim Bauen aus Rust-Quellcode übersetzt
      - uses: dtolnay/rust-toolchain@stable
      - name: Werbe- und Kauf-SDK weglassen (nur in der Play-Version)
        run: |
          @"
          dependency_overrides:
            google_mobile_ads:
              path: packages/google_mobile_ads_stub
            in_app_purchase:
              path: packages/in_app_purchase_stub
          "@ | Set-Content pubspec_overrides.yaml -Encoding utf8
      - run: flutter pub get
      - name: Windows-App bauen
        # UPDATE_MANIFEST_URL: Dort schaut die App nach neueren Versionen (Update-Hinweis)
        run: >-
          flutter build windows --release --build-number=${{ github.run_number }}
          --dart-define=UPDATE_MANIFEST_URL=https://github.com/${{ github.repository }}/releases/download/app-latest/version.json
      - name: Visual-C++-Laufzeit beilegen (läuft dann auch auf PCs ohne VC++-Redistributable)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $release = 'build\windows\x64\runner\Release'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Where-Object Name -match '^\d+(\.\d+){2,3}$' |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Get-ChildItem "$($_.FullName)\x64" -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if ($crt) {
            Write-Host "VC++-Laufzeit aus $($crt.FullName)"
            Copy-Item "$($crt.FullName)\*.dll" $release
          } else {
            Write-Host '::warning::VC++-Redist-Ordner nicht gefunden - nehme die DLLs aus System32.'
            'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll' |
              ForEach-Object { Copy-Item "$env:SystemRoot\System32\$_" $release }
          }
          'selfify.exe', 'flutter_windows.dll', 'libmpv-2.dll', 'smtc_windows.dll', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll',
          'data\app.so', 'data\icudtl.dat', 'data\flutter_assets' | ForEach-Object {
            if (-not (Test-Path (Join-Path $release $_))) { throw "Fehlt im Build: $_" }
          }
      - name: ZIP und Installer packen
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $release = 'build\windows\x64\runner\Release'
          $v = (Get-Item "$release\selfify.exe").VersionInfo
          $version = '{0}.{1}.{2}.{3}' -f $v.FileMajorPart, $v.FileMinorPart, $v.FileBuildPart, $v.FilePrivatePart
          Write-Host "Version $version"
          # ZIP ohne Installation: Ordner "Selfify" mit selfify.exe, allen DLLs und dem Ordner "data"
          New-Item -ItemType Directory -Force build\zip | Out-Null
          Copy-Item $release build\zip\Selfify -Recurse
          Compress-Archive -Path build\zip\Selfify -DestinationPath build\selfify-windows.zip -CompressionLevel Optimal -Force
          # Installer mit Startmenü-Eintrag und Deinstallation (Inno Setup; fehlt es auf dem Runner, wird es nachinstalliert)
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if (-not (Test-Path $iscc)) { throw 'Inno Setup nicht gefunden' }
          }
          & $iscc /Q "/DAppVersion=$version" "/DAppSourceDir=$PWD\$release" "/DAppOutputDir=$PWD\build" windows\installer\selfify.iss
          Get-ChildItem build\selfify-windows*
      - name: Windows-Dateien als Artefakt (nur zum Testen)
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: selfify-windows
          path: |
            mobile/build/selfify-windows.zip
            mobile/build/selfify-windows-setup.exe
          retention-days: 3
      - name: Windows-Dateien ins Release "app-latest" legen (bei jedem Stand auf main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Jeder Fehler eines gh-Aufrufs bricht den Schritt ab (sonst ginge z. B. ein fehlgeschlagener Upload unter)
          $PSNativeCommandUseErrorActionPreference = $true
          # Nur in das Release dieses Stands – ein später neu gestarteter alter Lauf darf neuere Dateien nicht ersetzen
          $target = gh release view app-latest --repo $env:GITHUB_REPOSITORY --json targetCommitish -q .targetCommitish
          if ($target -ne $env:GITHUB_SHA) {
            Write-Host "::warning::app-latest gehört inzwischen zu $target - Windows-Dateien dieses Laufs werden nicht hochgeladen."
            exit 0
          }
          gh release upload app-latest build/selfify-windows.zip build/selfify-windows-setup.exe --clobber --repo $env:GITHUB_REPOSITORY

          # Update-Hinweis am PC: version.json (vom Android-Job) um den Windows-Installer ergänzen
          $build = ${{ github.run_number }}
          $setup = @{
            url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/app-latest/selfify-windows-setup.exe"
            sha256 = (Get-FileHash build/selfify-windows-setup.exe -Algorithm SHA256).Hash.ToLower()
          }
          New-Item -ItemType Directory -Force build/manifest | Out-Null
          # Nur wenn es wirklich keine version.json gibt, eine neue anlegen – nie die des Android-Jobs ersetzen
          $assets = gh release view app-latest --repo $env:GITHUB_REPOSITORY --json assets -q '.assets[].name'
          if ($assets -contains 'version.json') {
            gh release download app-latest -p version.json -D build/manifest --clobber --repo $env:GITHUB_REPOSITORY
            $manifest = Get-Content build/manifest/version.json -Raw | ConvertFrom-Json
            if ($manifest.build -ne $build) {
              Write-Host "::warning::version.json gehört zu Build $($manifest.build) - Windows-Eintrag wird nicht ergänzt."
              exit 0
            }
          } else {
            # ohne Android-Signaturschlüssel gibt es keine version.json – dann nur mit Windows-Eintrag
            $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
            $manifest = [pscustomobject]@{
              build = $build; version = $version; commit = $env:GITHUB_SHA.Substring(0, 7)
              date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            }
          }
          $manifest | Add-Member -NotePropertyName windows -NotePropertyValue $setup -Force
          $manifest | ConvertTo-Json -Depth 5 | Set-Content build/manifest/version.json -Encoding utf8NoBOM
          Get-Content build/manifest/version.json
          gh release upload app-latest build/manifest/version.json --clobber --repo $env:GITHUB_REPOSITORY
      - name: Release mit Windows-Dateien (bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mobile/build/selfify-windows.zip
            mobile/build/selfify-windows-setup.exe

  ios:
    name: iOS (unsigniert, für AltStore/SideStore)
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.ios)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Werbe- und Kauf-SDK weglassen (nur in der Play-Version)
        run: |
          printf 'dependency_overrides:\n  google_mobile_ads:\n    path: packages/google_mobile_ads_stub\n  in_app_purchase:\n    path: packages/in_app_purchase_stub\n' > pubspec_overrides.yaml
      - run: flutter pub get
      - name: iOS bauen (ohne Signatur)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: IPA packen
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr ../selfify.ipa Payload
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: selfify-ios
          path: mobile/build/selfify.ipa
          retention-days: 7
      - name: IPA als Release "app-latest-ios" (manueller Start)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest-ios --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create app-latest-ios build/selfify.ipa --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "iOS – aktuelle Version (für AltStore/SideStore)" \
            --notes "Unsigniert, automatisch gebaut aus ${GITHUB_SHA::7}. Installation siehe README."
      - name: Release mit IPA (bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: mobile/build/selfify.ipa
