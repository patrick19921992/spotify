# App: Prüfung + Android-APK (bei jedem Lauf) + iOS-IPA für Sideloading (Tags/manuell)
name: App

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["mobile/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/app.yml"]
  workflow_dispatch:
    inputs:
      ios:
        description: "Auch die iOS-Version bauen (macOS-Runner)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  check:
    name: Analyse & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android-APK
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signaturschlüssel aus den Secrets (für Updates ohne Neuinstallation)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein Signaturschlüssel hinterlegt – die APK wird mit einem Test-Schlüssel signiert. Updates erfordern dann eine Neuinstallation (siehe README)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/selfify.keystore
          cat > android/key.properties <<PROPS
          storeFile=selfify.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - run: flutter pub get
      # Flutter braucht ein NDK, das auf den GitHub-Rechnern fehlt. Gradle würde es beim Bauen ohne
      # Wiederholung laden – ein abgebrochener Download ließ dann den ganzen Build scheitern.
      - name: Android-NDK laden (mit Wiederholung)
        run: |
          NDK_VERSION=$(grep -oP 'val ndkVersion: String = "\K[^"]+' \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" || true)
          if [ -z "$NDK_VERSION" ]; then
            echo "::warning::NDK-Version nicht gefunden – Gradle lädt das NDK selbst."
            exit 0
          fi
          echo "NDK $NDK_VERSION"
          for attempt in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null; then
              exit 0
            fi
            echo "::warning::NDK-Download fehlgeschlagen (Versuch $attempt), neuer Versuch …"
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            sleep 15
          done
          exit 1
      - name: APK bauen
        # UPDATE_MANIFEST_URL: Dort schaut die App nach neueren Versionen (Update-Hinweis)
        run: >-
          flutter build apk --release --build-number=${{ github.run_number }}
          --dart-define=UPDATE_MANIFEST_URL=https://github.com/${{ github.repository }}/releases/download/app-latest/version.json
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/selfify.apk
      - name: APK als Artefakt (nur zum Testen, falls Speicher frei)
        uses: actions/upload-artifact@v7
        # Bei privaten Repositories teilen sich Artefakte und Images 500 MB – ist das voll,
        # soll der Build trotzdem grün bleiben. Die APK gibt es zusätzlich als Release.
        continue-on-error: true
        with:
          name: selfify-android
          path: mobile/build/selfify.apk
          retention-days: 3
      - name: Aktuelle APK als Release "app-latest" (bei jedem Stand auf main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # version.json: daran erkennt die App, dass es eine neuere Version gibt
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+]*).*/\1/')
          cat > build/version.json <<JSON
          {
            "build": ${{ github.run_number }},
            "version": "$VERSION",
            "commit": "${GITHUB_SHA::7}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "android": {
              "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/app-latest/selfify.apk",
              "sha256": "$(sha256sum build/selfify.apk | cut -d' ' -f1)"
            }
          }
          JSON
          cat build/version.json
          gh release delete app-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create app-latest build/selfify.apk build/version.json --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "App – aktuelle Version" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Installation siehe README."
      - name: Release mit APK (bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: mobile/build/selfify.apk

  ios:
    name: iOS (unsigniert, für AltStore/SideStore)
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.ios)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: iOS bauen (ohne Signatur)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: IPA packen
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr ../selfify.ipa Payload
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: selfify-ios
          path: mobile/build/selfify.ipa
          retention-days: 7
      - name: IPA als Release "app-latest-ios" (manueller Start)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest-ios --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create app-latest-ios build/selfify.ipa --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "iOS – aktuelle Version (für AltStore/SideStore)" \
            --notes "Unsigniert, automatisch gebaut aus ${GITHUB_SHA::7}. Installation siehe README."
      - name: Release mit IPA (bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: mobile/build/selfify.ipa
