# App: Prüfung + Android-APK (bei jedem Lauf) + iOS-IPA für Sideloading (Tags/manuell)
name: App

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["mobile/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/app.yml"]
  workflow_dispatch:
    inputs:
      ios:
        description: "Auch die iOS-Version bauen (macOS-Runner)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  check:
    name: Analyse & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android-APK
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signaturschlüssel aus den Secrets (für Updates ohne Neuinstallation)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Kein Signaturschlüssel hinterlegt – die APK wird mit einem Test-Schlüssel signiert. Updates erfordern dann eine Neuinstallation (siehe README)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/selfify.keystore
          cat > android/key.properties <<PROPS
          storeFile=selfify.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - run: flutter pub get
      - name: APK bauen
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/selfify.apk
      - uses: actions/upload-artifact@v7
        with:
          name: selfify-android
          path: mobile/build/selfify.apk
      - name: Release mit APK (bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: mobile/build/selfify.apk

  ios:
    name: iOS (unsigniert, für AltStore/SideStore)
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.ios)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: iOS bauen (ohne Signatur)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: IPA packen
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr ../selfify.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: selfify-ios
          path: mobile/build/selfify.ipa
      - name: Release mit IPA (bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: mobile/build/selfify.ipa
