# Fehlersuche: baut mehrere Test-APKs der App, die jeweils genau eine Vermutung ausschließen, und legt sie ins
# Release "app-test". Nur vorübergehend – wird nach der Fehlersuche wieder entfernt.
name: Diagnose

on:
  pull_request:
    paths: [".github/workflows/diagnose.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  prepare:
    name: Release vorbereiten
    runs-on: ubuntu-latest
    steps:
      - name: Release "app-test" neu anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-test --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          cat > notes.md <<'NOTES'
          Test-Versionen zur Fehlersuche (Absturz beim Start). Alle haben dieselbe Build-Nummer wie die installierte App und sind mit demselben Schlüssel signiert – einfach über die bestehende Installation installieren.

          1. `test-1-ohne-werbung.apk` – GitHub-Version ganz ohne das Werbe-SDK
          2. `test-2-play.apk` – die Play-Version (eigene App „Selfify“ neben der anderen)
          3. `test-3-mit-werbe-dienst-start.apk` – GitHub-Version, aber der Werbe-Dienst startet wieder automatisch
          4. `test-4-ohne-workmanager.apk` – GitHub-Version ohne den Hintergrund-Dienst WorkManager
          NOTES
          gh release create app-test --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Test-Versionen (Fehlersuche)" --notes-file notes.md

  build:
    name: ${{ matrix.file }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { file: test-1-ohne-werbung.apk, flavor: full, stub: true, variant: plain }
          - { file: test-2-play.apk, flavor: play, stub: false, variant: plain }
          - { file: test-3-mit-werbe-dienst-start.apk, flavor: full, stub: false, variant: keepprovider }
          - { file: test-4-ohne-workmanager.apk, flavor: full, stub: false, variant: nowm }
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signaturschlüssel aus den Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Kein Signaturschlüssel hinterlegt - die Test-APK ließe sich nicht über die installierte App spielen."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/selfify.keystore
          cat > android/key.properties <<PROPS
          storeFile=selfify.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - name: Werbe-SDK durch den Platzhalter ersetzen
        if: matrix.stub
        run: |
          printf 'dependency_overrides:\n  google_mobile_ads:\n    path: packages/google_mobile_ads_stub\n' > pubspec_overrides.yaml
      - name: Manifest anpassen - Werbe-Dienst startet wieder automatisch
        if: matrix.variant == 'keepprovider'
        run: |
          cat > android/app/src/full/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" />
          XML
      - name: Manifest anpassen - ohne WorkManager-Start
        if: matrix.variant == 'nowm'
        run: |
          cat > android/app/src/full/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="com.google.android.gms.permission.AD_ID" tools:node="remove" />
              <application>
                  <provider
                      android:name="com.google.android.gms.ads.MobileAdsInitProvider"
                      tools:node="remove" />
                  <provider
                      android:name="androidx.startup.InitializationProvider"
                      android:authorities="${applicationId}.androidx-startup"
                      android:exported="false"
                      tools:node="merge">
                      <meta-data
                          android:name="androidx.work.WorkManagerInitializer"
                          tools:node="remove" />
                  </provider>
              </application>
          </manifest>
          XML
      - run: flutter pub get
      - name: Android-NDK laden (mit Wiederholung)
        run: |
          NDK_VERSION=$(grep -oP 'val ndkVersion: String = "\K[^"]+' \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" || true)
          if [ -z "$NDK_VERSION" ]; then exit 0; fi
          for attempt in 1 2 3; do
            if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null; then exit 0; fi
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"; sleep 15
          done
          exit 1
      - name: APK bauen (Build-Nummer 58 wie die installierte App)
        run: |
          EXTRA=()
          if [ "${{ matrix.flavor }}" = "play" ]; then EXTRA+=("--dart-define=CHANNEL=play"); fi
          flutter build apk --release --flavor ${{ matrix.flavor }} --build-number=58 \
            --dart-define=UPDATE_MANIFEST_URL=https://github.com/${{ github.repository }}/releases/download/app-latest/version.json \
            "${EXTRA[@]}"
          cp build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk build/${{ matrix.file }}
      - name: Manifest der fertigen APK in das Protokoll schreiben
        run: |
          MANIFEST=$(find build/app/intermediates -path '*merged_manifest*Release*' -name AndroidManifest.xml | head -1)
          echo "== $MANIFEST"
          grep -E 'provider|InitializationProvider|WorkManager|MobileAds|AD_ID|APPLICATION_ID' "$MANIFEST" | head -30 || true
      - name: APK ins Release "app-test" legen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload app-test build/${{ matrix.file }} --clobber --repo "$GITHUB_REPOSITORY"
