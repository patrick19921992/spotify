[project]
name = "selfify-server"
version = "0.1.0"
description = "Eigener Musik- und Video-Streamingserver mit YouTube-Downloader"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Automatisch erzeugte Migrationen nicht umformatieren
"app/migrations/versions/*" = ["E501"]
