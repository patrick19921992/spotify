# Nur für Entwickler (neue Migration erzeugen):
#   alembic revision --autogenerate -m "beschreibung"
# Im Betrieb laufen die Migrationen automatisch beim Serverstart.

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
# Leer = Datenbank aus DATA_DIR (siehe app/config.py)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
